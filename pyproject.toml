[project]
name = "piper-mcp"
version = "0.1.0"
description = "Local MCP server for Piper TTS: French and English text-to-speech with pronunciation normalisation"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["mcp>=2,<3"]
keywords = ["mcp", "tts", "piper", "text-to-speech", "french", "english", "offline", "local"]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: MIT License",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
[project.urls]
Repository = "https://github.com/STIFLEUR390/piper-mcp"

[project.scripts]
piper-mcp = "piper_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/piper_mcp"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
